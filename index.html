let lang = "en";
const t = (k, vars) => {
  let s = (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replace("{" + a + "}", b);
  return s;
};

const PILLARS = [
  {n:1, st:"partial"}, {n:2, st:"partial"}, {n:3, st:"progress"},
  {n:4, st:"planned"}, {n:5, st:"planned"}, {n:6, st:"progress"},
];
const BADGE = {
  shipped:"bg-emerald-400/10 text-emerald-300", progress:"bg-emerald-400/10 text-emerald-300",
  partial:"bg-sky-400/10 text-sky-300", planned:"bg-amber-400/10 text-amber-300",
};
const RT = {
  api:{key:"rt.api", cls:"bg-cyan-400/10 text-cyan-300"},
  browser:{key:"rt.browser", cls:"bg-violet-400/10 text-violet-300"},
  cli:{key:"rt.cli", cls:"bg-fuchsia-400/10 text-fuchsia-300"},
};
const columns = [
  {id:"ready", key:"col.ready", tone:"border-slate-500/40"},
  {id:"exec", key:"col.exec", tone:"border-cyan-400/50"},
  {id:"human", key:"col.human", sub:"col.humanSub", tone:"border-amber-400/50"},
  {id:"review", key:"col.review", tone:"border-emerald-400/50"},
];
const order = columns.map(c => c.id);
const INITIAL = () => [
  {id:"TRD-12", key:"c.12", rt:"api", model:"Claude", col:"ready", who:"@Agent-Architect", tokens:0, compute:0, blk:"blk.gate"},
  {id:"TRD-9", key:"c.9", rt:"cli", model:"MicroVM #2", col:"exec", who:"@Agent-Coder", tokens:1.12, compute:0.31, blk:"blk.arch"},
  {id:"TRD-7", key:"c.7", rt:"browser", model:"Playwright", col:"human", who:"who.askWa", tokens:0.41, compute:0.22, blk:"blk.2fa"},
  {id:"TRD-4", key:"c.4", rt:"api", model:"GPT", col:"review", who:"@Agent-Reviewer · {pr}", tokens:0.37, compute:0},
];
let cards = INITIAL(), killed = false, spend = 41.20, saved = 18.75, taking = null, routerEv = null;
const isSession = k => k.rt !== "api";
const cost = k => k.tokens + k.compute;
const whoText = w => w.startsWith("who.") ? t(w) : w.replace("{pr}", t("who.pr"));
const router = () => routerEv ? t(routerEv.key, {id: routerEv.id}) : t("router.idle");

function render(){
  const board = document.getElementById("board");
  board.innerHTML = columns.map(c => `
    <div class="rounded-xl border ${c.tone} bg-white/[.02] p-3 min-h-[230px]">
      <h3 class="text-sm font-semibold text-white">${t(c.key)}</h3>
      ${c.sub ? `<p class="text-xs text-amber-300/80">${t(c.sub)}</p>` : ""}
      <div class="mt-3 space-y-3">
        ${cards.filter(k => k.col === c.id).map(k => `
          <div class="card rounded-lg border ${taking === k.id ? "border-amber-400/70" : "border-white/10"} bg-[#0F1629] p-3" data-id="${k.id}">
            <div class="flex justify-between text-xs"><span class="font-mono text-cyan-300">${k.id}</span><span class="font-mono text-slate-400">$${cost(k).toFixed(2)}</span></div>
            <p class="mt-1 text-sm text-white">${t(k.key)}</p>
            <p class="mt-1.5 flex flex-wrap gap-1 text-[10px]"><span class="rounded px-1.5 py-0.5 ${RT[k.rt].cls}">${t(RT[k.rt].key)} · ${k.model}</span></p>
            <p class="mt-1 text-[10px] font-mono text-slate-500">${t("cost.tokens")} $${k.tokens.toFixed(2)}${isSession(k) ? ` · ${t("cost.compute")} $${k.compute.toFixed(2)}` : ""}</p>
            <p class="mt-1 text-xs text-slate-400">${taking === k.id ? t("who.human") : whoText(k.who)}</p>
            ${k.col === "human" ? `<p class="mt-1 text-xs text-amber-200/90">${t(k.blk)}</p>` : ""}
            ${k.col === "review" ? `<p class="mt-2 text-xs text-emerald-400">${t("card.distilled")}</p>` :
              k.col === "human" ? (taking === k.id ? "" : `<button class="act mt-2 text-xs font-semibold text-amber-300 hover:underline disabled:opacity-40 disabled:no-underline" data-id="${k.id}" ${killed ? "disabled" : ""}>${isSession(k) ? t("btn.takeover") : t("btn.approve")}</button>`) :
              `<button class="act mt-2 text-xs font-semibold text-cyan-300 hover:underline disabled:opacity-40 disabled:no-underline" data-id="${k.id}" ${killed ? "disabled" : ""}>${t("btn.adv")}</button>`}
          </div>`).join("")}
      </div>
    </div>`).join("");
  board.querySelectorAll(".act").forEach(b => b.addEventListener("click", () => act(b.dataset.id)));
  renderTakeover();
  document.getElementById("router").textContent = router();
}

function renderTakeover(){
  const box = document.getElementById("takeover");
  box.classList.toggle("hidden", !taking);
  if (!taking) return;
  const k = cards.find(c => c.id === taking);
  document.getElementById("tk-title").textContent = t("tk.title", {id: k.id});
  document.getElementById("tk-url").textContent = k.rt === "browser" ? "https://portal.supplier.example/verify" : "worker-2:~/app $ tradvia session attach";
  document.getElementById("tk-blocker").textContent = t(k.blk);
}

function charge(k){
  const add = +(Math.random() * 0.9 + 0.2).toFixed(2);
  if (isSession(k)) { k.compute += +(add * 0.4).toFixed(2); k.tokens += +(add * 0.6).toFixed(2); }
  else k.tokens += add;
  spend += add; saved += +(add * 0.4).toFixed(2);
}

function act(id){
  const k = cards.find(c => c.id === id);
  if (k.col === "human" && isSession(k)) { taking = k.id; render(); return; }
  const el = document.querySelector(`.card[data-id="${id}"]`);
  el && el.classList.add("moving");
  setTimeout(() => {
    if (k.col === "ready") { k.who = "@Agent-Coder"; routerEv = {id:k.id, key: k.rt === "api" ? ["router.ev1", "router.ev2", "router.ev3"][Math.floor(Math.random() * 3)] : "router.ev4"}; }
    if (k.col === "exec") { k.who = k.rt === "api" ? "who.ask" : "who.askWa"; }
    if (k.col === "human") { k.who = "@Agent-Reviewer · {pr}"; }
    charge(k);
    k.col = order[order.indexOf(k.col) + 1];
    updateMeters(); render();
  }, 250);
}

function handBack(){
  const k = cards.find(c => c.id === taking);
  taking = null;
  k.who = "@Agent-Reviewer · {pr}"; routerEv = {id:k.id, key:"router.ev4"};
  charge(k); k.col = "review";
  updateMeters(); render();
}

function updateMeters(){
  document.getElementById("spend").textContent = "$" + spend.toFixed(2);
  document.getElementById("saved").textContent = "$" + saved.toFixed(2);
  document.getElementById("budget").style.width = Math.min(100, spend / 120 * 100).toFixed(0) + "%";
  const a = document.getElementById("agents");
  a.textContent = killed ? 0 : cards.filter(c => c.col === "exec").length + 1;
  a.className = "font-mono " + (killed ? "text-red-400" : "text-white");
  const kb = document.getElementById("kill");
  kb.textContent = killed ? t("kill.off") : t("kill.on");
  kb.setAttribute("aria-pressed", killed);
}

function renderPillars(){
  document.getElementById("pillars").innerHTML = PILLARS.map(p => `
    <article class="rounded-xl border border-white/10 p-6">
      <div class="flex items-start justify-between gap-3"><h3 class="font-semibold text-white">${t("p" + p.n + ".t")}</h3><span class="shrink-0 rounded px-2 py-0.5 text-xs ${BADGE[p.st]}">${t("st." + p.st)}</span></div>
      <p class="mt-3 text-sm text-slate-400">${t("p" + p.n + ".d")}</p>
    </article>`).join("");
}

const INT_BADGE = {shipped:"bg-emerald-400/10 text-emerald-300", partial:"bg-sky-400/10 text-sky-300", planned:"bg-amber-400/10 text-amber-300"};
// Real status of each connector (keep in sync with the README and docs/).

  {g:"agents", items:[["Claude Code","shipped"],["OpenAI Codex CLI","planned"],["Gemini CLI","planned"],["Google Antigravity","planned"],["Kiro","planned"],["Air","planned"],["Cursor","planned"],["Windsurf","planned"],["GitHub Copilot","planned"]]},

function renderTools(){
  document.getElementById("tools").innerHTML = INT_GROUPS.map((gr, i) => `
    <div style="margin-top:${i ? "2.25rem" : "0"}">
      <h3 class="text-sm font-semibold text-slate-300">${t("int.g." + gr.g)}</h3>
      <ul class="mt-3 grid gap-2 grid-cols-2 sm:grid-cols-3 lg:grid-cols-4">${gr.items.map(([n, st]) =>
        `<li class="flex items-center justify-between gap-2 rounded-lg border border-white/10 px-3 py-2.5"><span class="text-sm text-white">${n}</span><span class="shrink-0 rounded px-1.5 py-0.5 text-[10px] ${INT_BADGE[st]}">${t("int." + st)}</span></li>`).join("")}</ul>
    </div>`).join("");
}


document.getElementById("kill").addEventListener("click", () => { killed = !killed; updateMeters(); render(); });
document.getElementById("handback").addEventListener("click", handBack);

const eaModal = document.getElementById("ea-modal"), eaBtn = document.getElementById("early");
function eaOpen(){ eaModal.classList.remove("hidden"); eaModal.classList.add("flex"); document.getElementById("ea-close").focus(); }
function eaClose(){ eaModal.classList.add("hidden"); eaModal.classList.remove("flex"); eaBtn.focus(); }
eaBtn.addEventListener("click", eaOpen);
document.getElementById("ea-close").addEventListener("click", eaClose);
eaModal.addEventListener("click", e => { if (e.target === eaModal) eaClose(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !eaModal.classList.contains("hidden")) eaClose(); });

function setLang(l){
  lang = I18N[l] ? l : "en";
  document.documentElement.lang = lang;
  document.title = t("meta.title");
  document.querySelector('meta[name="description"]').setAttribute("content", t("meta.desc"));
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  try { localStorage.setItem("tradvia-lang", lang); } catch(e) {}
  renderPillars(); renderTools(); updateMeters(); render();
}

document.querySelectorAll(".lang").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

function initialLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q) return q.toLowerCase().startsWith("pt") ? "pt-BR" : q.toLowerCase().startsWith("es") ? "es" : "en";
  try { const s = localStorage.getItem("tradvia-lang"); if (s && I18N[s]) return s; } catch(e) {}
  const n = (navigator.language || "en").toLowerCase();
  return n.startsWith("pt") ? "pt-BR" : n.startsWith("es") ? "es" : "en";
}
setLang(initialLang());
